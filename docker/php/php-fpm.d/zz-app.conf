[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Für den Healthcheck des Dienstes app (cgi-fcgi, nur im Container erreichbar; Caddy leitet nur index.php weiter).
ping.path = /fpm-ping
; Umgebungsvariablen aus Compose an PHP durchreichen.
clear_env = no
