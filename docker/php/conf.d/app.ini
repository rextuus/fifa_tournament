; eat – PHP-Einstellungen für Produktion (zusätzlich zu php.ini-production).
; Bild-Uploads (Profil-/Teambilder) sind klein; großzügig, aber begrenzt.
upload_max_filesize = 16M
post_max_size = 17M
memory_limit = 256M
max_execution_time = 60
expose_php = Off
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; Turnierabende finden in Deutschland statt.
date.timezone = Europe/Berlin
