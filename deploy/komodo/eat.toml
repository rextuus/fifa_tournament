# eat (FIFA-Turniere) – Komodo-Ressourcen (Resource Sync). Muster: wedora.toml.
# Feldnamen geprüft gegen komodo_client 2.3.2 (docs.rs: StackConfig, ProcedureConfig, RunStackService) und
# komo.do/docs/automate/sync-resources. `server` (statt server_id) und RunStackService als Procedure-Execution
# sind dort nicht ausdrücklich gezeigt, laufen aber genau so bei wedora (Komodo v2.3).
#
# Einbinden: Komodo → Syncs → New Resource Sync, Quelle = dieses Repo, Resource Path = deploy/komodo/eat.toml.
# Hier stehen keine Secrets. Alles in [[…]] sind Komodo-Secrets (Settings → Variables, Häkchen „Secret“);
# die Liste steht in .env.prod.dist und docs/deployment.md. Nicht geheime Werte stehen direkt hier.
# Achtung: Komodo ersetzt einen unbekannten [[NAME]] nicht und meldet auch keinen Fehler. Deshalb prüft
# pre-deploy.sh die geschriebene .env.prod.local und bricht ab, wenn noch ein [[…]] darin steht – also im
# environment-Block unten auch in Kommentaren nie [[…]] schreiben.

[[stack]]
name = "eat"
description = "FIFA-Turniere: Teams, Spielpläne und Ergebnisse für die Turnierabende"
tags = ["eat", "projekt"]
# Ein Sync legt den Stack nur an bzw. gleicht ihn an. Deployt wird bewusst von Hand („Deploy“).
deploy = false

[stack.config]
# Name des Servers in Komodo (Servers-Liste), nicht der Hostname.
server = "abyss"
# Quick-Links im Kopf des Stacks
links = [
  "https://eat.wh-company.de",
  "https://github.com/rextuus/fifa_tournament",
  "http://localhost:9121/projekte/#eat",
]

# Quelle: GitHub-Repo. git_account = unter Settings → Providers für github.com hinterlegter Account mit Token
# (das Repo muss für den Token freigegeben sein).
git_provider = "github.com"
git_https = true
git_account = "rextuus"
repo = "rextuus/fifa_tournament"
branch = "master"
# Leer = neuester Commit von branch. Für einen Rollback hier einen Commit-Hash eintragen und deployen.
commit = ""
# Nicht neu klonen: Daten liegen ohnehin außerhalb (Volume eat_database_data, /srv/eat/…), .env.prod.local schreibt Komodo neu.
reclone = false

# Ergibt: docker compose -p eat -f compose.prod.yaml --env-file .env.prod.local …
# project_name MUSS „eat“ bleiben; die Volumes sind zusätzlich per name: in compose.prod.yaml festgenagelt.
file_paths = ["compose.prod.yaml"]
project_name = "eat"
env_file_path = ".env.prod.local"

# Wird bei jedem Deploy nach .env.prod.local geschrieben (KEY=wert, Rechte 600).
# MYSQL_* gelten nur beim allerersten Start der Datenbank; danach müssen sie zum Volume passen, nie neu würfeln.
# APP_SECRET von securitas übernehmen, damit Remember-me-Cookies gültig bleiben (sonst einmal neu anmelden).
environment = """
# Öffentliche Adresse; TLS macht der Caddy auf dem VPS
DEFAULT_URI = https://eat.wh-company.de

# Secrets
APP_SECRET = [[EAT_APP_SECRET]]
MYSQL_PASSWORD = [[EAT_MYSQL_PASSWORD]]
MYSQL_ROOT_PASSWORD = [[EAT_MYSQL_ROOT_PASSWORD]]
SPOTIFY_CLIENT_ID = [[EAT_SPOTIFY_CLIENT_ID]]
SPOTIFY_CLIENT_SECRET = [[EAT_SPOTIFY_CLIENT_SECRET]]
IMGPROXY_KEY = [[EAT_IMGPROXY_KEY]]
IMGPROXY_SALT = [[EAT_IMGPROXY_SALT]]
# Optional (Fehlermeldungen an Sentry). Ohne Sentry diese Zeile löschen.
SENTRY_DSN = [[EAT_SENTRY_DSN]]

# Spotify: genau diese URI muss im Spotify-Developer-Dashboard als Redirect URI eingetragen sein
SPOTIFY_REDIRECT_URI = https://eat.wh-company.de/spotify/callback
# Länge der Tor-Hymne in Sekunden
FORCED_RUNNING_TIME = 30

# Keine offene Registrierung; Benutzer per app:create-default-user
REGISTRATION_ENABLED = 0
# eat verschickt keine Mails
MAILER_DSN = null://null

# Datenbank (nicht ändern, sonst passt es nicht mehr zum bestehenden Volume)
MYSQL_DATABASE = eat
MYSQL_USER = eat

# Eingang: Caddy auf dem VPS (10.0.0.1) → WireGuard → abyss 10.0.0.2:8199
HTTP_BIND = 10.0.0.2
HTTP_PORT = 8199
REVERSE_PROXY_IPS = 10.0.0.1

# Host-Ordner (einmalig anlegen, docs/deployment.md): Originalbilder und Sicherungen
IMAGE_HOST_DIR = /srv/eat/images
BACKUP_DIR = /srv/eat/backups
BACKUP_KEEP = 14
"""

# Images für app/worker/migrate/web werden auf dem Server gebaut (docker compose build vor up).
run_build = true
# Kein „compose pull“ vor jedem Deploy: mysql und imgproxy sind fest gepinnt, up holt fehlende Images selbst.
auto_pull = false
destroy_before_deploy = false

# Ergibt: docker compose … up -d --wait --wait-timeout 300
# --wait: Der Deploy gilt erst als erfolgreich, wenn alle Dienste „healthy“ sind; scheitert migrate oder wird
# ein Dienst nicht gesund, zeigt Komodo den Deploy als fehlgeschlagen.
extra_args = ["--wait", "--wait-timeout", "300"]

# migrate läuft bei jedem Deploy einmal und beendet sich, backup läuft nur auf Abruf. Ohne diese Liste würde
# Komodo den Stack wegen der beendeten Container als „Unhealthy“ anzeigen.
ignore_services = ["migrate", "backup"]

# Vor dem Bauen: Secrets prüfen, Datenbank sichern (läuft im Periphery-Container im Stack-Ordner; Exit ≠ 0 bricht ab).
pre_deploy.path = "."
pre_deploy.command = "sh deploy/komodo/pre-deploy.sh"

# Nach erfolgreichem up: Zustand ins Deploy-Log, alte eat-Images aufräumen.
post_deploy.path = "."
post_deploy.command = "sh deploy/komodo/post-deploy.sh"

# Kein automatisches Deploy bei Push oder neuen Images – deployt wird bewusst.
webhook_enabled = false
poll_for_updates = false
auto_update = false
send_alerts = true

# ---------------------------------------------------------------------------------------------------------
# Tägliche Datenbanksicherung: führt `docker compose run --rm --no-TTY --no-deps backup daily` im Stack aus
# (eat-db-<zeit>-daily.sql.gz in /srv/eat/backups, 14 bleiben liegen). Die Originalbilder (/srv/eat/images) sind
# nicht im Dump; die nimmt die Offsite-Sicherung über backup.offsite_paths im homelab-Inventar mit.
# no_deps: Ändert ein noch nicht deployter Commit den Dienst database, würde `compose run` ihn sonst nebenbei neu
# erstellen. Läuft der Stack nicht, scheitert der Dump absichtlich, und Komodo alarmiert (failure_alert).

[[procedure]]
name = "eat-backup"
description = "eat: täglicher Datenbank-Dump nach /srv/eat/backups (Rotation: BACKUP_KEEP)"
tags = ["eat", "projekt"]

[procedure.config]
schedule_format = "English"
schedule = "Every day at 03:15"
schedule_timezone = "Europe/Berlin"
schedule_enabled = true
schedule_alert = false
failure_alert = true

[[procedure.config.stage]]
name = "Datenbank sichern"
executions = [
  { execution.type = "RunStackService", execution.params = { stack = "eat", service = "backup", command = ["daily"], no_tty = true, no_deps = true } },
]
